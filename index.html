<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3ECFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1430" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>帰宅クイズ</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DM+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root{
  --ground:#F5EEFC; --bg:linear-gradient(180deg,#F3ECFF 0%,#FBEFF6 60%,#FFF7F2 100%);
  --paper:#FFFFFF; --paper-2:#F3EEFB; --card:rgba(255,255,255,.85); --card-line:#FFFFFF;
  --ink:#2E2450; --muted:#8C7DB8; --line:#E9E2F7;
  --go:#6E4FE8; --go-2:#8B6CF6; --go-ink:#FFFFFF; --go-soft:#F1E9FF; --stop:#F25C7A; --stop-soft:#FFE6EC;
  --ticket:#FFFFFF; --ticket-ink:#2E2450; --ticket-line:#EDE6FA; --ticket-pat:transparent;
  --band:linear-gradient(120deg,#8B6CF6,#B48CFF 60%,#FFA8C0);
  --map-land:#F1E9FF; --map-edge:#D3C2F5; --map-hl:#F25C7A; --sea:#EAF1FB; --bar:#B9A6F2;
  --c-geo:#4DAE7C; --c-his:#D49A3A; --c-pol:#E86A4A; --c-eco:#5B6FD6; --c-soc:#3AA6C9;
  --shadow:0 12px 30px rgba(120,90,200,.10);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-ja:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","IBM Plex Sans KR",sans-serif;
  --f-disp:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#1A1430; --bg:linear-gradient(180deg,#1A1430 0%,#221735 60%,#27192E 100%);
    --paper:#241C3D; --paper-2:#2E2550; --card:rgba(36,28,61,.85); --card-line:#3A2F5C;
    --ink:#F0EAFF; --muted:#A99BD0; --line:#3A2F5C;
    --go:#9B7BFF; --go-2:#B69AFF; --go-ink:#1A1430; --go-soft:#3A2F6A; --stop:#FF7A96; --stop-soft:#4A2438;
    --ticket:#241C3D; --ticket-ink:#F0EAFF; --ticket-line:#3A2F5C; --ticket-pat:transparent;
    --band:linear-gradient(120deg,#6E4FE8,#8B6CF6 60%,#E06A8C);
    --map-land:#3A2F5C; --map-edge:#241C3D; --map-hl:#FF7A96; --sea:#1E2244; --bar:#6E5BB8;
    --shadow:0 12px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#1A1430; --bg:linear-gradient(180deg,#1A1430 0%,#221735 60%,#27192E 100%);
  --paper:#241C3D; --paper-2:#2E2550; --card:rgba(36,28,61,.85); --card-line:#3A2F5C;
  --ink:#F0EAFF; --muted:#A99BD0; --line:#3A2F5C;
  --go:#9B7BFF; --go-2:#B69AFF; --go-ink:#1A1430; --go-soft:#3A2F6A; --stop:#FF7A96; --stop-soft:#4A2438;
  --ticket:#241C3D; --ticket-ink:#F0EAFF; --ticket-line:#3A2F5C; --ticket-pat:transparent;
  --band:linear-gradient(120deg,#6E4FE8,#8B6CF6 60%,#E06A8C);
  --map-land:#3A2F5C; --map-edge:#241C3D; --map-hl:#FF7A96; --sea:#1E2244; --bar:#6E5BB8;
  --shadow:0 12px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{background:var(--ground);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0}
button,input,select{touch-action:manipulation}
body{background:var(--bg);background-attachment:scroll;min-height:100vh;min-height:100dvh;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));padding-block:0 calc(40px + env(safe-area-inset-bottom))}
.ja{font-family:var(--f-ja)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--go);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:transparent;margin-inline:-16px;padding:12px 16px 6px;display:flex;align-items:center;gap:12px}
.logo{font-family:"Dela Gothic One",var(--f-ja);font-size:20px;font-weight:400;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--ink)}
.logo i{display:none}
.nav{margin-left:auto;display:flex;gap:4px;background:var(--card);border:1px solid var(--card-line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.nav[hidden]{display:none}
.nav button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button[aria-pressed="true"]{background:var(--go);color:var(--go-ink)}
.mock{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:1px 6px}

.wrap{max-width:460px;margin:0 auto;padding-top:18px;display:flex;flex-direction:column;gap:14px}
.wrap.wide{max-width:980px}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:24px;padding:18px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.prac-res{display:flex;flex-direction:column;gap:12px}
.prac-res .t-grid{background:var(--paper-2);border:0;border-radius:16px;padding:12px 14px}
.prac-tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--muted);border:1.5px solid var(--muted);border-radius:8px;padding:2px 8px}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:600;text-decoration:underline;cursor:pointer;padding:6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;background:var(--c)}
.muted{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:999px;padding:17px 16px;font-size:17px;font-weight:700;background:linear-gradient(90deg,var(--go-2),var(--go));color:var(--go-ink);cursor:pointer;box-shadow:0 14px 28px rgba(110,79,232,.28)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--card-line);box-shadow:var(--shadow)}
.btn.small{width:auto;padding:9px 16px;font-size:14px;box-shadow:none}

/* entry */
.setcard{display:flex;flex-direction:column;gap:8px;position:relative;overflow:visible}
.setcard h1{font-size:30px;line-height:1.25;font-weight:700;letter-spacing:-.02em}
.stk{position:absolute;display:grid;place-items:center;color:#fff;font-weight:900;border-radius:20px;box-shadow:0 10px 22px rgba(120,90,200,.25),inset -4px -6px 10px rgba(0,0,0,.12),inset 4px 6px 10px rgba(255,255,255,.5);pointer-events:none}
.stk.s1{width:52px;height:52px;right:6px;top:-20px;background:linear-gradient(145deg,#9B7BFF,#6E4FE8);font-size:26px;transform:rotate(-10deg)}
.stk.s2{width:34px;height:34px;right:54px;top:6px;background:linear-gradient(145deg,#FF9FB8,#F25C7A);font-size:18px;transform:rotate(14deg);border-radius:12px}
.setcard .eyebrow{padding-right:64px}.setcard h1{padding-right:56px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.chips span{font-size:12px;font-weight:700;color:var(--go);background:var(--go-soft);border-radius:999px;padding:5px 10px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.nameinput{width:100%;font:inherit;font-size:17px;font-weight:600;color:var(--ink);background:var(--paper-2);border:1.5px solid transparent;border-radius:14px;padding:13px 16px}
.nameinput:focus{border-color:var(--go);outline:none}
.names{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.names button{border:1px solid var(--line);background:var(--paper-2);border-radius:10px;padding:12px 4px;font-size:15px;font-weight:600;cursor:pointer}
.names button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.seg{display:flex;gap:6px;background:var(--paper-2);border:0;border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:10px 4px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 4px 10px rgba(120,90,200,.15)}

.pick{width:100%;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--paper-2);border:1.5px solid transparent;border-radius:14px;padding:12px 14px}

/* rail */
.rail{display:flex;flex-direction:column;gap:8px}
.rail-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.home-count{font-size:14px;font-weight:600}
.home-count b{font-family:var(--f-disp);font-weight:700;font-size:22px;color:var(--go);margin-inline:2px}
.lap{font-size:12px;color:var(--muted);font-weight:600}
.track{display:flex;align-items:center;gap:0}
.track .end{font-family:var(--f-ja);font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.stations{flex:1;display:flex;align-items:center;justify-content:space-between;position:relative;margin-inline:8px;min-width:0}
.stations::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:var(--card);border-radius:2px}
.stations .fill{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;background:var(--go);border-radius:2px;transition:width .4s ease}
.st{position:relative;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--card-line);flex:none;box-shadow:0 2px 6px rgba(120,90,200,.12)}
.st.done{background:var(--go);border-color:var(--go)}
.stations.dense .st{width:7px;height:7px;border-width:1.5px;box-shadow:none}
.stations.dense .st.now{transform:scale(1.5)}
.st.now{border-color:var(--go);transform:scale(1.3)}

/* question */
.q{display:flex;flex-direction:column;gap:12px}
.qtag{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.prompt{font-size:21px;font-weight:700;line-height:1.4;letter-spacing:-.01em}
.prompt .big{display:block;font-size:24px;margin-top:2px}
.prompt .jaline{display:block;font-family:var(--f-ja);font-size:16px;font-weight:500;color:var(--muted);margin-top:2px}
.mapbox{background:var(--card);border:1px solid var(--card-line);border-radius:24px;padding:12px;display:flex;justify-content:center;box-shadow:var(--shadow)}
.mapbox svg{width:100%;height:auto;max-height:36vh;display:block}
.mapbox path{fill:var(--map-land);stroke:var(--map-edge);stroke-width:1.1;stroke-linejoin:round}
.mapbox path.hl{fill:var(--map-hl)}
.mapbox .ring{fill:none;stroke:var(--map-hl);stroke-width:2.5}
.mapbox svg.jzoom{max-height:40vh}
.mapbox svg.wmap{aspect-ratio:1.3;width:min(100%, calc(40vh * 1.3));max-height:none;margin:0 auto}
.wmap .sea{fill:var(--sea)}
.wmap path{fill:var(--map-land);stroke:var(--map-edge);stroke-linejoin:round}
.wmap path.hl{fill:var(--map-hl)}
.wmap .ring{fill:none;stroke:var(--map-hl)}
.jzoom .sea{fill:var(--sea)}
.jzoom .feat-line{fill:none;stroke:var(--map-hl);stroke-linecap:round;stroke-linejoin:round}
.jzoom .feat-pt{fill:var(--map-hl);stroke:var(--paper);}
.wfeat .feat-line{fill:none;stroke:var(--map-hl);stroke-linecap:round;stroke-linejoin:round}
.wfeat .feat-pt{fill:var(--map-hl);stroke:var(--paper)}
.wfeat .feat-head{fill:var(--map-hl)}
.wmap{overflow:hidden}
.clim{width:100%;height:auto;max-height:36vh;display:block}
.clim .ax{stroke:var(--muted);stroke-width:.8}
.clim .grid{stroke:var(--line);stroke-width:.6}
.clim .zero{stroke:var(--muted);stroke-width:.8;stroke-dasharray:3 3}
.clim text{font-family:var(--f-body);font-size:9px;fill:var(--muted)}
.clim .bar{fill:var(--bar)}
.clim .tline{fill:none;stroke:var(--map-hl);stroke-width:2.2;stroke-linejoin:round}
.clim .tdot{fill:var(--map-hl)}
.clim .hline{fill:none;stroke:var(--go);stroke-width:1.8;stroke-linejoin:round}
.clim .hdot{fill:var(--go)}
.clim .mlab{font-size:9px;font-weight:700;fill:var(--ink)}
.mapbox .inset{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
@media (prefers-reduced-motion:no-preference){.mapbox .ring{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}}
@keyframes pulse{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
.prompt .qtext{display:block;font-size:18px;font-weight:700;line-height:1.5}
.prompt .stem{display:block;font-family:var(--f-ja);font-size:17px;font-weight:500;line-height:1.6}
.prompt .stem b{font-weight:700;background:linear-gradient(transparent 62%,var(--go-soft) 62%)}
.prompt .gloss{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:4px}
.abc{list-style:none;margin:10px 0 0;padding:12px 14px;border:0;border-radius:16px;background:var(--paper-2);display:flex;flex-direction:column;gap:6px}
.abc li{display:flex;gap:10px;align-items:baseline;font-weight:500}
.abc li>b{font-family:var(--f-mono);font-weight:500;flex:none}
.abc li .ja{font-size:16px;font-weight:700}
.abc li small{display:block;font-size:12px;color:var(--muted)}
.mapbox .lab circle{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
.mapbox .lab text{font-family:var(--f-mono);font-size:13px;font-weight:500;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.choices{display:flex;flex-direction:column;gap:8px}
.choices.grid2{display:grid;grid-template-columns:1fr 1fr}
.choices.grid2 .choice .t{flex-direction:column;align-items:flex-start;gap:0}
.choices.grid2 .choice{gap:8px;padding:10px}
.choices.grid2 .choice .k{width:22px;height:22px;font-size:12px}
.choices.grid2 .choice .t .main,.choices.grid2 .choice .t .sub{word-break:keep-all;overflow-wrap:anywhere}
.choices.grid2 .choice .t .sub{font-size:12px;line-height:1.3}
@media (max-width:359px){.choices.grid2{grid-template-columns:1fr}.choices.grid2 .choice .t{flex-direction:row;align-items:baseline}}
.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1.5px solid var(--card-line);background:var(--card);border-radius:16px;padding:12px 14px;cursor:pointer;min-height:56px;box-shadow:0 4px 14px rgba(120,90,200,.06)}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:500;background:var(--paper-2);border:0;color:var(--muted)}
.choice .t{flex:1;display:flex;flex-direction:row;align-items:baseline;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;min-width:0}
.choice .t .main{font-size:16px;font-weight:700;line-height:1.35}
.choice .t .sub{font-family:var(--f-ja);font-size:13px;color:var(--muted)}
.choice .t .main.ja{font-family:var(--f-ja);font-size:18px}
.choice.year .t .main{font-family:var(--f-mono);font-size:20px;font-weight:500;letter-spacing:.02em}
@media (hover:hover){.choice:hover:not(:disabled){border-color:var(--go-2)}}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--go);background:var(--go-soft)}
.choice.right .k{background:var(--go);color:var(--go-ink);border-color:var(--go)}
.choice.wrong{border-color:var(--stop);background:var(--stop-soft)}
.choice.wrong .k{background:var(--stop);color:#fff;border-color:var(--stop)}
.choice.dim{opacity:.55}
.choice .ord{margin-left:auto;flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;background:var(--go);color:var(--go-ink)}
.choice .ord.empty{background:transparent;border:1.5px dashed var(--muted)}
.choice .yr{margin-left:auto;font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.fb{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.fb.ok{background:var(--go-soft)}
.fb.ng{background:var(--stop-soft)}
.fb .head{font-weight:700;font-size:15px}
.fb.ok .head{color:var(--go)}
.fb.ng .head{color:var(--stop)}
.fb .lock{font-size:12px;font-weight:600;color:var(--muted)}

/* round break */
.lapcard{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding-block:28px}
.lapcard .n{font-family:var(--f-disp);font-weight:700;font-size:56px;line-height:1;color:var(--stop)}

/* ticket */
.ticket{position:relative;background:var(--ticket);color:var(--ticket-ink);border-radius:28px;padding:18px 20px 18px;overflow:hidden;box-shadow:0 20px 40px rgba(120,90,200,.18)}
.t-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.1em}
.t-head .kind{font-family:var(--f-ja);font-weight:700;font-size:20px;letter-spacing:.06em}
.band{margin:12px -20px 0;padding:16px 20px;background:var(--band);color:#fff;display:flex;flex-direction:column;gap:2px}
.band-date{font-size:13px;font-weight:700;letter-spacing:.04em;opacity:.9}
.band-test{font-size:22px;font-weight:700;line-height:1.3}
.band-mix{font-size:12px;font-weight:600;opacity:.85}
.route{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.route .stn{display:flex;flex-direction:column;align-items:center}
.route .stn b{font-family:var(--f-ja);font-weight:700;font-size:22px;line-height:1.1}
.route .stn span{font-size:11px;font-weight:600;letter-spacing:.08em;opacity:.8}
.route .arrow{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--map-edge) 0 8px,transparent 8px 14px);position:relative;margin-bottom:14px}
.perf{border-top:2px dashed var(--ticket-line);margin:16px -20px 12px}
.t-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.t-grid .f span{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;opacity:.75}
.t-grid .f b{font-size:17px;font-weight:700}
.t-grid .f.mono b{font-family:var(--f-body);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.clock{font-family:var(--f-body);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.code{font-family:var(--f-disp);font-weight:700;font-size:26px;letter-spacing:.12em;line-height:1;color:var(--go)}
.t-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:12px}
.growth{font-size:14px;font-weight:700}
.growth .up{color:var(--go)}
.sent{font-size:12px;color:var(--muted);text-align:center}

/* teacher */
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.tgrid{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.setlist{display:flex;flex-direction:column;gap:12px}
.setgroup{display:flex;flex-direction:column;gap:6px}
.setgroup h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.setgroup h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.setopt{display:flex;align-items:center;gap:10px;border:1.5px solid transparent;border-radius:14px;padding:10px 12px;cursor:pointer;background:var(--paper-2)}
.setopt input{accent-color:var(--go)}
.setopt .nm{font-weight:600;font-size:14px}
.setopt .ct{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.setopt.off{opacity:.5;cursor:not-allowed}
.setopt:has(input:checked){border-color:var(--go);background:var(--go-soft)}

<script>
(function(){
"use strict";
const D = window.KITAKU_DATA;

/* ───────── 설정 (배포 때 여기만 고치면 됨) ───────── */
const CONFIG = {
  defaultN: 20,
  worldChrono: false,              // 세계 연표 범위 공개 여부 (자료 작업 끝나면 true 로)

  statsUrl: "",                    // 학생 분석: Apps Script 웹 앱 URL (비워 두면 강사 화면에서 입력). 비밀 키는 여기 넣지 말 것
  secret: "kitaku-2026",
  teacherPinHash: 189797738,       // 강사 화면 PIN의 hashStr 값 (초기 PIN 7350). 바꾸려면 콘솔에서 hashStr("새PIN") 실행 후 여기 붙여넣기
  classes: { "토일반": [], "화목반": [] },   // 반 이름 (학생 이름은 본인이 입력)
  form: {                          // 구글 폼 「帰宅クイズ 기록」 (비우면 이 기기에만 저장)
    url: "https://docs.google.com/forms/d/e/1FAIpQLSemiDuYKbrHDiZTOfmAiOC2cex5Eo5zgWYsxRKfBBTARWng9Q/formResponse",
    fields: { name:"entry.1954971135", cls:"entry.1556659008", set:"entry.1257529705", first:"entry.2027853110", time:"entry.761713755", wrong:"entry.428638031", rounds:"entry.1047549204" }
  }
};

/* ───────── 유틸 ───────── */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; }
function rngFrom(seed){ let a=seed>>>0; return function(){ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
const pick = (arr, r) => arr[Math.floor(r()*arr.length)];
function shuffle(arr, r){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function weightedSample(items, wfn, n, r){
  const pool = items.map(it => ({it, w: wfn(it)})).filter(x => x.w>0);
  const out=[];
  while(out.length<n && pool.length){
    const tot=pool.reduce((s,x)=>s+x.w,0); let t=r()*tot, i=0;
    for(;i<pool.length;i++){ t-=pool[i].w; if(t<=0) break; }
    i=Math.min(i,pool.length-1); out.push(pool[i].it); pool.splice(i,1);
  }
  return out;
}
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtTime = d => [d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,"0")).join(":");
const fmtDur = ms => { const s=Math.round(ms/1000); return Math.floor(s/60)+"분 "+String(s%60).padStart(2,"0")+"초"; };
const dailyCode = (date, setId) => String(hashStr(CONFIG.secret+"|"+date+"|"+setId) % 10000).padStart(4,"0");
const store = {
  get(k, d){ try{ const v=localStorage.getItem("kitaku."+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("kitaku."+k, JSON.stringify(v)); }catch(e){} }
};

/* ───────── 데이터 ───────── */
const PREFS = D.prefs, REG = D.regions, JPH = D.jphis.map((e,i)=>({...e, id:"J"+String(i+1).padStart(3,"0")})), WORLD = D.world;
const LAND = D.landforms.map((x,i)=>({...x, id:"L"+String(i+1).padStart(3,"0")}));
const CON = D.concept.map(x=>({...x, id:"K"+x.src}));
const LANDC = LAND.filter(x=>x.core), LANDM = LANDC.filter(x=>x.xy);   // core = 자료집 03~06 요약표에 실린 지형
const CTRY = D.countries || [], CLIM = D.climate || [];
const WLAND = (D.wland || []).filter(x=>x.t!=="산"), WBELT = D.wbelts || {};
const WSTAT = (D.wstat || []).map(x=>({...x, ko: x.kind==="most" ? x.q+" 나라" : x.item+(x.meas?" "+x.meas:"")}));
const WM = D.wmap, WPATH = Object.fromEntries((WM?WM.paths:[]).map(p=>[p.id,p]));
const GW = {S:6, A:4, B:2.5, C:1.2, N:1};
const SW = {3:4, 2:2.5, 1:1.2, 0:1};
const SUBJ = { geo:["지리","var(--c-geo)"], his:["역사","var(--c-his)"], pol:["정치","var(--c-pol)"], eco:["경제","var(--c-eco)"], soc:["현대사회","var(--c-soc)"], all:["통합","#2E5A4C"], con:["개념","#6B4FA0"] };
const FIELD2SUBJ = {"정치":"pol","경제":"eco","현대사회":"soc","역사":"his","지리":"geo"};
const conW = x => 1;

const SETS = [
  {id:"all", group:"통합본", subj:"all", name:"전 범위 통합", composite:[
      {label:"일본 지리", share:.20, sets:["jp-region","jp-pref","jp-feature","jp-capital","jp-land"]},
      {label:"세계 지리", share:.15, sets:["g-country","g-capital","g-feature","g-land","g-climate","g-stat"]},
      {label:"일본 연표", share:.15, sets:["jp-his"]},
      {label:"세계 연표", share:.20, sets:["w-pol","w-eco","w-soc","w-his","w-geo"]},
      {label:"개념", share:.30, sets:["c-pol","c-eco","c-soc","c-his","c-geo"]}
    ], pool:()=>[...PREFS, ...JPH, ...(CONFIG.worldChrono? WORLD : []), ...LAND, ...CON, ...CTRY, ...CLIM, ...WLAND, ...WSTAT]},
  {id:"jp-region",  group:"일본 지리", subj:"geo", name:"8지방 구분",     pool:()=>PREFS, w:p=>SW[p.star], kinds:["prefRegion","prefRegion","regionMap"]},
  {id:"jp-pref",    group:"일본 지리", subj:"geo", name:"토도부현",       pool:()=>PREFS, w:p=>SW[p.star], kinds:["mapPref"]},
  {id:"jp-feature", group:"일본 지리", subj:"geo", name:"토도부현 특징",   pool:()=>PREFS.filter(p=>prefClues(p).length), w:p=>SW[p.star], kinds:["prefHint"]},
  {id:"jp-capital", group:"일본 지리", subj:"geo", name:"현청소재지",     pool:()=>PREFS, w:p=>p.n===13?0:(p.diff?5:0.6), kinds:["prefCapital","capitalPref","mapCapital"]},
  {id:"jp-land",    group:"일본 지리", subj:"geo", name:"일본 지형",           pool:()=>LANDC, w:x=>1, kinds:x=>x.xy ? ["landMap","landMap","landPref","prefLand"] : ["landPref","landPref","prefLand"]},
  {id:"g-country",  group:"세계 지리", subj:"geo", name:"나라 위치", pool:()=>CTRY.filter(c=>WPATH[c.iso]), w:c=>c.core?3:1, kinds:["countryMap"]},
  {id:"g-capital",  group:"세계 지리", subj:"geo", name:"수도", pool:()=>CTRY.filter(c=>c.cap && WPATH[c.iso]), w:c=>c.core?3:1, kinds:["countryCapital","capitalCountry"]},
  {id:"g-feature",  group:"세계 지리", subj:"geo", name:"나라의 특징", pool:()=>CTRY.filter(c=>c.hint), w:c=>c.core?2:1, kinds:["countryHint"]},
  {id:"g-land",     group:"세계 지리", subj:"geo", name:"세계 지형", pool:()=>WLAND, w:x=>x.t==="해류"||x.t==="해협·운하"?1.5:1, kinds:wlKinds},
  {id:"g-climate",  group:"세계 지리", subj:"geo", name:"기후 그래프", pool:()=>CLIM, w:x=>1, kinds:["climOndo","climHyther","climCity"]},
  {id:"g-stat",     group:"세계 지리", subj:"geo", name:"주요 통계", pool:()=>WSTAT, w:x=>x.kind==="most"?3:(x.cat==="농산물"||x.cat==="에너지 자원"?1.2:1), kinds:wsKinds},
  {id:"jp-his",     group:"일본 연표", subj:"his", name:"일본 관련 연표", pool:()=>JPH, w:e=>GW[e.g]||1, kinds:"chrono"},
  {id:"w-pol", group:"세계 연표", subj:"pol", name:"정치",     pool:()=>WORLD.filter(e=>e.f==="정치"),     w:e=>GW[e.g]||1, kinds:"chrono"},
  {id:"w-eco", group:"세계 연표", subj:"eco", name:"경제",     pool:()=>WORLD.filter(e=>e.f==="경제"),     w:e=>GW[e.g]||1, kinds:"chrono"},
  {id:"w-soc", group:"세계 연표", subj:"soc", name:"현대사회", pool:()=>WORLD.filter(e=>e.f==="현대사회"), w:e=>GW[e.g]||1, kinds:"chrono"},
  {id:"w-his", group:"세계 연표", subj:"his", name:"역사",     pool:()=>WORLD.filter(e=>e.f==="역사"),     w:e=>GW[e.g]||1, kinds:"chrono"},
  {id:"w-geo", group:"세계 연표", subj:"geo", name:"지리",     pool:()=>WORLD.filter(e=>e.f==="지리"),     w:e=>GW[e.g]||1, kinds:"chrono"},
  {id:"w-top", group:"세계 연표", subj:"his", name:"전 과목 S·A 등급", pool:()=>WORLD.filter(e=>e.g==="S"||e.g==="A"), w:e=>GW[e.g], kinds:"chrono"},
  {id:"c-pol", group:"개념", subj:"pol", name:"정치",     pool:()=>CON.filter(x=>x.subj==="정치"),     w:conW, kinds:["concept"]},
  {id:"c-eco", group:"개념", subj:"eco", name:"경제",     pool:()=>CON.filter(x=>x.subj==="경제"),     w:conW, kinds:["concept"]},
  {id:"c-soc", group:"개념", subj:"soc", name:"현대사회", pool:()=>CON.filter(x=>x.subj==="현대사회"), w:conW, kinds:["concept"]},
  {id:"c-his", group:"개념", subj:"his", name:"역사",     pool:()=>CON.filter(x=>x.subj==="역사"),     w:conW, kinds:["concept"]},
  {id:"c-geo", group:"개념", subj:"geo", name:"지리",     pool:()=>CON.filter(x=>x.subj==="지리"),     w:conW, kinds:["concept"]},
  {id:"c-all", group:"개념", subj:"con", name:"전 과목",  pool:()=>CON, w:conW, kinds:["concept"]},
];
if(!CONFIG.worldChrono){   // 세계 연표: 준비 중 — 범위 선택에서 막고 통합본에서도 뺌(나머지 비율로 다시 나눔)
  SETS.forEach(s=>{ if(s.group==="세계 연표") s.soon="준비 중"; });
  const all=SETS[0]; all.composite=all.composite.filter(p=>p.label!=="세계 연표");
  const t=all.composite.reduce((a,p)=>a+p.share,0); all.composite.forEach(p=>p.share=p.share/t);

const setById = id => SETS.find(s=>s.id===id) || SETS[0];
const okSet = id => { const s=SETS.find(x=>x.id===id); return s && !s.soon ? id : "all"; };
const setLabel = s => s.composite ? "통합본" : s.group+" · "+s.name;

/* ───────── 지도 ───────── */
const M = D.jpmap;
function mapSVG(hl, opts={}){
  const set = new Set(hl);
  let paths = "";
  M.paths.forEach((p,i)=>{ paths += `<path d="${p.d}"${set.has(i+1)?' class="hl"':''}/>`; });
  let rings = "";
  if(opts.ring !== false && hl.length===1){ const p=M.paths[hl[0]-1]; rings = `<circle class="ring" cx="${p.cx}" cy="${p.cy}" r="16"/>`; }
  const b=M.inset;
  return `<svg viewBox="${M.vb}" role="img" aria-label="일본 지도"><rect class="inset" x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="4"/>${paths}${rings}</svg>`;
}

/* ───────── 세계지도 · 지형 지도 · 기후 그래프 (직접 그림) ───────── */
function worldSVG(iso){
  const t = WPATH[iso]; const [x0,y0,x1,y1] = t.bb;
  let w = Math.max((x1-x0)*2.6, 64), h = Math.max((y1-y0)*2.6, 50);
  if(w < h*1.3) w = h*1.3; else h = w/1.3;
  if(w > 1000){ w = 1000; h = 1000/1.3; }
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  let vx = Math.max(-500, Math.min(500-w, cx-w/2)), vy = Math.max(-260, Math.min(260-h, cy-h/2));

    const others = shuffle(LANDC.filter(y=>y!==x && !y.p.includes(p.n) && y.t===x.t), r);
    const rest = shuffle(LANDC.filter(y=>y!==x && !y.p.includes(p.n)), r);
    const w=[]; for(const y of [...others,...rest]){ if(w.length>=3) break; if(!w.includes(y)) w.push(y); }
    const c = mk(x, w, r, y=>({main:y.ja, sub:y.ko, ja:true}));
    return {...c, tag:x.t, prompt:`다음 중 <span class="big ja">${esc(p.ja)}</span>에 있는 것은?`,
      explain:`<b class="ja">${esc(x.ja)}</b>(${esc(x.ko)}) — ${esc(x.t)} · <span class="ja">${esc(p.ja)}</span><br><span class="muted">${esc(x.note)}</span><br><span class="muted">${w.map(y=>`${esc(y.ja)} → ${y.p.map(n=>esc(prefByN(n).ja)).join("·")}`).join(" / ")}</span>`, mapAfter:[p.n]};
  },

  landMap(x, r){
    const line = x.xy.length>1;
    const fill = shuffle(LANDM.filter(y=>y!==x && y.t!==x.t && (y.xy.length>1)===line), r).sort((a,b)=>(b.t==="산맥")-(a.t==="산맥"));   // 구조선 오답은 산맥부터
    const same = [...shuffle(LANDM.filter(y=>y!==x && y.t===x.t), r), ...fill].slice(0,3);
    const c = mk(x, same, r, y=>({main:y.ja, sub:y.ko, ja:true}));
    const what = x.xy.length>1 ? `<span style="color:var(--map-hl)">빨간 선</span>으로 표시된 ${esc(x.t)}` : `<span style="color:var(--map-hl)">빨간 점</span>으로 표시된 ${esc(x.t)}`;
    return {...c, tag:x.t+" · 지도", prompt:`지도에 ${what}${josa(x.t,"는","은")}?`, svg:landSVG(x),
      explain:`<b class="ja">${esc(x.ja)}</b>(${esc(x.ko)}) — ${x.p.map(n=>`<span class="ja">${esc(prefByN(n).ja)}</span>`).join(" · ")}<br><span class="muted">${esc(x.note)}</span>`};
  },

  /* ── 세계 지리 ── */
  countryMap(c, r){
    const w = nearCountries(c, 3);
    const k = mk(c, w, r, ctryLabel);
    return {...k, tag:"나라 위치", prompt:`지도에 <span style="color:var(--map-hl)">빨간색</span>으로 칠한 나라는?`, svg:worldSVG(c.iso), explain:ctryExplain(c)};
  },
  countryCapital(c, r){
    const w = nearCountries(c, 6, x=>x.cap && x.cap!==c.cap).slice(0,3);
    const k = mk(c, w, r, x=>({main:x.cap}));
    return {...k, tag:"수도", prompt:`<span style="color:var(--map-hl)">빨간색</span>으로 칠한 나라의 수도는?`, svg:worldSVG(c.iso), explain:ctryExplain(c)};
  },
  capitalCountry(c, r){
    if(c.cap===c.ko) return BUILD.countryCapital(c, r);
    const w = nearCountries(c, 3, x=>x.cap);
    const k = mk(c, w, r, ctryLabel);
    return {...k, tag:"수도", prompt:`<span class="big">${esc(c.cap)}</span>어느 나라의 수도일까?`, svgAfter:worldSVG(c.iso), explain:ctryExplain(c)};
  },
  countryHint(c, r){
    const reg = shuffle(CTRY.filter(x=>x!==c && x.reg===c.reg), r), near = nearCountries(c, 6);
    const w=[]; for(const x of [...reg, ...near]){ if(w.length>=3) break; if(!w.includes(x)) w.push(x); }
    const k = mk(c, w, r, ctryLabel);
    return {...k, tag:"나라의 특징", prompt:`<span class="qtext">${esc(c.hint)}</span>`, subPrompt:"이 설명에 해당하는 나라는?", svgAfter: WPATH[c.iso]? worldSVG(c.iso) : null, explain:ctryExplain(c)};
  },
  climOndo(st, r){
    const k = mk(st.k, climWrong(st.k, r), r, x=>({main:`${x} ${CLIM_NAME[x][0]}`, sub:CLIM_NAME[x][1]}));
    return {...k, tag:"기후 그래프", prompt:`이 기후 그래프(雨温図)에 해당하는 기후는?`, svg:climSVG(st,"ondo"), explain:climExplain(st)};
  },
  climHyther(st, r){
    if(!st.p) return BUILD.climOndo(st, r);
    const k = mk(st.k, climWrong(st.k, r), r, x=>({main:`${x} ${CLIM_NAME[x][0]}`, sub:CLIM_NAME[x][1]}));
    return {...k, tag:"하이더그래프", prompt:`이 하이더그래프(ハイサーグラフ)에 해당하는 기후는?`, svg:climSVG(st,"hyther"), explain:climExplain(st)};
  },
  climCity(st, r){
    const kinds = climWrong(st.k, r);
    const w = kinds.map(k=>shuffle(CLIM.filter(x=>x.k===k), r)[0]).filter(Boolean).slice(0,3);
    const k = mk(st, w, r, x=>({main:x.ko, sub:x.cn && x.cn!==x.ko ? x.cn : ""}));
    return {...k, tag:"기후 그래프 · 도시", prompt:`이 기후 그래프(雨温図)에 해당하는 도시는?`, svg:climSVG(st,"ondo"),
      explain: climExplain(st) + `<br><span class="muted">${w.map(x=>`${esc(x.ko)} = ${esc(x.k)}`).join(" / ")}</span>`};
  },


  /* ── 세계 자연지리 ── */
  wlMap(x, r){
    const w = wlPick(x, r, y=>y.xy);
    const c = mk(x, w, r, wlLabel);
    const what = x.t==="해류" ? `<span style="color:var(--map-hl)">빨간 화살표</span>로 표시된 해류` : x.xy.some(l=>l.length>1) ? `<span style="color:var(--map-hl)">빨간 선</span>으로 표시된 ${esc(x.t)}` : `<span style="color:var(--map-hl)">빨간 점</span>으로 표시된 ${esc(x.t)}`;
    return {...c, tag:x.t+" · 지도", prompt:`지도에 ${what}${josa(x.t.split("·").pop(),"는","은")}?`, svg:wfeatSVG(x), explain:wlExplain(x)};
  },
  wlClue(x, r){
    const cl = wlClues(x); if(!cl.length) return BUILD.wlMap(x, r);
    const c = mk(x, wlPick(x, r, y=>!wlConflict(x,y) && !wlConflict(y,x)), r, wlLabel);
    return {...c, tag:x.t, prompt:`<span class="qtext">${cl.map(esc).join("<br>")}</span>`, subPrompt:`이 설명에 해당하는 ${esc(x.t)}${josa(x.t.split("·").pop(),"는","은")}?`, svgAfter:x.xy?wfeatSVG(x):null, explain:wlExplain(x)};
  },
  wlMouth(x, r){
    const others = shuffle([...new Set(WLAND.filter(y=>y.t==="하천" && y.mouth && y.mouth!==x.mouth).map(y=>y.mouth))], r).slice(0,3);
    const c = mk(x.mouth, others, r, m=>({main:m}));
    return {...c, tag:"하천 · 하구", prompt:`<span class="big">${esc(x.ko)}</span>어느 바다로 흘러들까?`, svgAfter:x.xy?wfeatSVG(x):null,
      explain:wlExplain(x)+`<br><span class="muted">${WLAND.filter(y=>y.t==="하천" && others.includes(y.mouth)).map(y=>`${esc(y.ko)} → ${esc(y.mouth)}`).join(" / ")}</span>`};
  },
  wlLink(x, r){
    const c = mk(x, wlPick(x, r, ()=>true), r, wlLabel);
    return {...c, tag:"해협·운하", prompt:`<span class="big">${esc(x.link)}</span>두 바다를 잇는 곳은?`, svgAfter:x.xy?wfeatSVG(x):null, explain:wlExplain(x)};
  },
  wlBelt(x, r){
    const other = Object.entries(WBELT).filter(([g])=>g!==x.belt).flatMap(([g,l])=>l.map(n=>({n,g})));
    const w = shuffle(other, r).slice(0,3);
    const c = mk({n:x.ko, g:x.belt}, w, r, o=>({main:o.n}));
    return {...c, tag:"대지형", prompt:`다음 중 <b>${esc(x.belt)}</b>에 속하는 것은?`,
      explain:Object.entries(WBELT).map(([g,l])=>`<b>${esc(g)}</b> ${l.map(esc).join(" · ")}`).join("<br>")};
  },
  wlCont(x, r){
    const w = wlPick(x, r, y=>y.cont!==x.cont && !(x.t==="산맥" && /우랄/.test(y.ko+x.ko)));
    if(w.length<3) return x.xy? BUILD.wlMap(x, r) : BUILD.wlBelt(x, r);
    const c = mk(x, w, r, y=>({main:y.ko, sub:y.cont}));
    const c2 = {...c, choices:c.choices.map(ch=>({main:ch.main}))};
    return {...c2, tag:x.t, prompt:`다음 중 <b>${esc(x.cont)}</b>에 있는 ${esc(x.t)}${josa(x.t.split("·").pop(),"는","은")}?`, svgAfter:x.xy?wfeatSVG(x):null,
      explain:wlExplain(x)+`<br><span class="muted">${w.map(y=>`${esc(y.ko)} = ${esc(y.cont)}`).join(" / ")}</span>`};
  },
  wlCurClue(x, r){
    const c = mk(x, wlPick(x, r, y=>y.grp!==x.grp), r, y=>({main:y.ko, sub:y.warm?"난류":"한류"}));
    const c2 = {...c, choices:c.choices.map(ch=>({main:ch.main}))};
    return {...c2, tag:"해류", prompt:`<span class="qtext">${esc(x.note)}</span>`, subPrompt:"이와 관련된 해류는?", svgAfter:x.xy?wfeatSVG(x):null, explain:wlExplain(x)};
  },
  wlWarm(x, r){
    const w = shuffle(WLAND.filter(y=>y.t==="해류" && y.warm!==x.warm), r).slice(0,3);
    const c = mk(x, w, r, wlLabel);
    const kind = x.warm? "난류" : "한류";
    return {...c, tag:"해류", prompt:`다음 중 <b>${kind}</b>${josa(kind,"는","은")}?`,
      explain:`<b>난류</b> ${WLAND.filter(y=>y.t==="해류"&&y.warm).map(y=>esc(y.ko)).join(" · ")}<br><b>한류</b> ${WLAND.filter(y=>y.t==="해류"&&!y.warm).map(y=>esc(y.ko)).join(" · ")}`};
  },

  /* ── 세계 주요 통계 ── */
  stTop(x, r){
    const w = [...shuffle(x.ranks.slice(1), r), ...wsOutsiders(x, r, 3)].slice(0,3);
    const c = mk(x.ranks[0], w, r, n=>({main:n}));
    return {...c, tag:"통계 · "+x.cat, prompt:`<span class="big">${esc(x.ko)}</span>세계 1위 국가는?`, explain:wsExplain(x)};
  },
  stNotIn(x, r){
    const out = wsOutsiders(x, r, 1)[0]; if(!out) return BUILD.stTop(x, r);
    const c = mk(out, shuffle(x.ranks, r).slice(0,3), r, n=>({main:n}));
    return {...c, tag:"통계 · "+x.cat, prompt:`<span class="big">${esc(x.ko)}</span>상위 ${x.ranks.length}개국에 <u>들지 않는</u> 나라는?`, explain:wsExplain(x)};
  },
  stWhich(x, r){
    const sib = shuffle(WSTAT.filter(y=>y!==x && y.kind==="rank" && y.cat===x.cat && y.meas===x.meas && y.ranks.slice(0,3).join()!==x.ranks.slice(0,3).join()), r).slice(0,3);
    if(sib.length<3) return BUILD.stTop(x, r);
    const c = mk(x, sib, r, y=>({main:y.item}));
    return {...c, tag:"통계 · "+x.cat, prompt:`<span class="qtext">${x.ranks.slice(0,3).map((n,i)=>`${circ(i)} ${esc(n)}`).join("  ")}</span>`, subPrompt:`${esc(x.meas||"")} 상위국이 이와 같은 품목은?`,
      explain:wsExplain(x)+`<br><span class="muted">${sib.map(y=>`${esc(y.item)}: ${y.ranks.slice(0,3).map(esc).join("·")}`).join(" / ")}</span>`};
  },
  stMost(x, r){
    let pick=null;
    for(let t=0;t<30 && !pick;t++){
      const cand = shuffle(x.rows.map((row,i)=>({row,i})), r).slice(0,4);
      const best = cand.reduce((a,b)=> (x.hi? b.i<a.i : b.i>a.i) ? b : a);
      if(cand.every(o=>o===best || o.row[1]!==best.row[1])) pick={cand,best};
    }
    const {cand,best} = pick;
    const c = mk(best, cand.filter(o=>o!==best), r, o=>({main:o.row[0]}));
    const lst = cand.slice().sort((a,b)=>a.i-b.i).map(o=>`${o===best?"<b>":""}${esc(o.row[0])} ${esc(o.row[1])}${x.unit||""}${o===best?"</b>":""}`).join(" · ");
    return {...c, tag:"통계 · "+x.cat, prompt:`다음 중 <b>${esc(x.q)}</b> 나라는?`, explain:`${lst}<br><span class="muted">${esc(best.row[2]||"")}</span>`};
  },

  /* ── 연표 (한국어) ── */
  yearToEvent(e, r, pool){
    const cands = pool.filter(x=>x.y!==e.y && Math.abs(x.y-e.y)<=25 && x.ko!==e.ko);
    const sameType = shuffle(cands.filter(x=>x.t===e.t), r), rest=shuffle(cands, r);
    const w=[]; for(const x of [...sameType,...rest]){ if(w.length>=3) break; if(!w.includes(x) && !w.some(z=>z.ko===x.ko)) w.push(x); }
    const c=mk(e, w, r, x=>({main:x.ko, sub:x.ja}));
    return {...c, tag:"연도 → 사건", prompt:`<span class="big" style="font-family:var(--f-mono);font-weight:500">${e.y}년</span>에 있었던 일은?`, explain:chronoExplain([e,...w], e)};
  },
  eventToYear(e, r, pool){
    const ys=new Set([e.y]); const w=[];
    const add=y=>{ if(y && !ys.has(y) && w.length<3 && y<2020){ ys.add(y); w.push(y); } };
    if(e.eff) add(e.eff);
    shuffle(pool.filter(x=>Math.abs(x.y-e.y)<=12 && x.y!==e.y), r).forEach(x=>add(x.y));
    while(w.length<3) add(e.y + (Math.floor(r()*12)-6));
    const c=mk(e.y, w, r, y=>({main:String(y), year:true}));
    return {...c, tag:"사건 → 연도", prompt:`<span class="big">${esc(e.ko)}</span><span class="jaline">${esc(e.ja)}</span>`, subPrompt: e.eff? "채택·체결(성립)된 해는?" : "몇 년?", explain:chronoExplain([e], e)};
  },
  effYear(e, r, pool){
    if(!e.eff) return BUILD.eventToYear(e, r, pool);
    const ys=new Set([e.eff]); const w=[];
    const add=y=>{ if(y && !ys.has(y) && w.length<3){ ys.add(y); w.push(y); } };
    add(e.y); add(e.eff+1); add(e.eff-2); add(e.y-1);
    const c=mk(e.eff, w, r, y=>({main:String(y), year:true}));
    return {...c, tag:"채택 ↔ 발효", prompt:`<span class="big">${esc(e.ko)}</span><span class="jaline">${esc(e.ja)}</span>`, subPrompt:"발효·시행된 해는?", explain:chronoExplain([e], e)};
  },
  order(e, r, pool){
    const near = shuffle(pool.filter(x=>x!==e && Math.abs(x.y-e.y)>=2 && Math.abs(x.y-e.y)<=40 && x.ko!==e.ko), r);
    const picked=[e];
    for(const x of near){ if(picked.length>=3) break; if(picked.every(p=>Math.abs(p.y-x.y)>=2)) picked.push(x); }
    if(picked.length<3) return BUILD.eventToYear(e, r, pool);
    const items = shuffle(picked, r);
    const correctOrder = items.map((x,i)=>i).sort((a,b)=>items[a].y-items[b].y);
    return {tag:"순서 배열", order:true, prompt:"오래된 것부터 차례로 누르세요", choices:items.map(x=>({main:x.ko, sub:x.ja, y:x.y})), correctOrder,
      explain: chronoExplain(items, e)};
  },

  /* ── 개념 (기출 키워드) ── */
  concept(x, r){
    const idx = [0,1,2,3]; const ord = shuffle(idx, r);
    const choices = ord.map(i=>({main:x.c[i]}));
    return {tag:x.subj+" · 개념", prompt:`<span class="qtext">${esc(x.q)}</span>`, choices, answer: ord.indexOf(x.a),
      explain:`${esc(x.e)}<br><span class="muted">키워드: ${x.kw.map(esc).join(" · ")}</span>`};
  }
};
function chronoExplain(list, key){
  return list.slice().sort((a,b)=>a.y-b.y).map(x=>`${yr(x.y)}${x.eff?`<span class="muted">→${x.eff}</span>`:""} ${x===key?"<b>":""}${esc(x.ko)}${x===key?"</b>":""} <span class="ja muted">${esc(x.ja)}</span>`).join("<br>")
    + (key && key.core ? `<br><span class="muted">${esc(key.core)}</span>` : "");
}
function itemId(setId, it){ return it.n ? "P"+String(it.n).padStart(2,"0") : it.id; }
function itemName(it){ return it.n ? it.ja : (it.ko || it.q || it.ja); }
function itemLabel(it){ const t = it.n ? it.ko : (it.ko || it.q || it.ja); return t.length>42 ? t.slice(0,40)+"…" : t; }

function planSet(set, n, seed){
  if(set.composite) return planComposite(set, n, seed);
  const r = rngFrom(seed);
  const pool = set.pool();
  const items = weightedSample(pool, set.w, Math.min(n, pool.length), r);
  return items.map(it=>{
    let kind;
    if(set.kinds==="chrono"){
      const opts=["yearToEvent","eventToYear","eventToYear","order"]; if(it.eff) opts.push("effYear");
      kind = pick(opts, r);
    } else kind = pick(typeof set.kinds==="function" ? set.kinds(it) : set.kinds, r);
    return {it, kind};
  });
}
function planComposite(set, n, seed){
  const r = rngFrom(seed);
  // 부분별 문항 수: 비율대로 나누고 남는 건 소수점이 큰 쪽부터
  const raw = set.composite.map(p=>p.share*n), q = raw.map(Math.floor);
  let left = n - q.reduce((a,b)=>a+b,0);
  raw.map((v,i)=>[v-Math.floor(v),i]).sort((a,b)=>b[0]-a[0]).forEach(([_,i])=>{ if(left>0){ q[i]++; left--; } });
  const used = new Set(), out = [];
  set.composite.forEach((part,pi)=>{
    const subs = part.sets.map(setById);
    for(let k=0;k<q[pi];k++){
      const sub = weightedSample(subs, s=>s.pool().length, 1, r)[0];
      const cand = sub.pool().filter(it=>!used.has(itemId(sub.id,it)) && !(sub.id.startsWith("w-") && it.jp));   // 통합본: 일본연표에 있는 사건은 세계연표 쪽에서 빼서 중복 방지
      const pl = planSet({...sub, pool:()=>cand}, 1, Math.floor(r()*1e9))[0];
      if(!pl) continue;
      used.add(itemId(sub.id, pl.it)); out.push({...pl, sid:sub.id});
    }
  });
  return shuffle(out, r);
}
function buildQ(set, plan, seed){
  const r=rngFrom(seed);
  const src = plan.sid ? setById(plan.sid) : set;
  return {...BUILD[plan.kind](plan.it, r, src.pool()), src};
}

function startQuiz(practice){
  if(!entry.name) return;
  store.set("lastName", entry.name); if(!practice) store.set("lastCls", entry.cls);
  const set=setById(practice? prac.set : preset.set);
  const nWant = practice? prac.n : preset.n;
  const seed = hashStr(today()+"|"+set.id+"|"+entry.name+"|"+Date.now());
  const plans = planSet(set, nWant, seed);
  S = { set, practice:!!practice, cls: practice? "연습" : entry.cls, name:entry.name, n:plans.length, plans, seed,
        round:1, queue:plans.map((_,i)=>i), pos:0, next:[], cleared:new Set(), firstOk:new Set(), firstWrong:[],
        streak:{}, tries:{}, startAt:Date.now(), done:false, q:null, sel:[] };
  loadQ(); go("quiz");
}
function loadQ(){
  const idx=S.queue[S.pos]; S.tries[idx]=(S.tries[idx]||0)+1;
  S.q = buildQ(S.set, S.plans[idx], S.seed + idx*7919 + S.tries[idx]*104729);
  S.sel=[]; S.answered=false;
}

function railHTML(){
  const cur=S.queue[S.pos];

  const left=S.n-S.cleared.size;
  return `<div class="rail">
    <div class="rail-top"><span class="home-count">집까지<b>${left}</b>문제</span><span class="lap">${S.round>1? S.round+"번째 바퀴 · 틀린 것만" : (S.pos+1)+" / "+S.queue.length}</span></div>

  </div>`;
}
function renderQuiz(){
  const q=S.q, qs=q.src||S.set, [sn,sc]=SUBJ[qs.subj];
  const keys="1234";
  let choices="";
  if(q.order){
    choices = q.choices.map((c,i)=>{ const o=S.sel.indexOf(i);
      let cls="choice"; if(S.answered){ cls += q.correctOrder[o]===i? " right":" wrong"; }
      return `<button class="${cls}" data-i="${i}" ${S.answered||o>=0?"disabled":""}><span class="t"><span class="main">${esc(c.main)}</span><span class="sub">${esc(c.sub)}</span></span>${S.answered?`<span class="yr">${c.y}</span>`:""}<span class="ord${o<0?" empty":""}">${o<0?"":o+1}</span></button>`; }).join("");
  } else {
    choices = q.choices.map((c,i)=>{ let cls="choice"+(c.year||c.mono?" year":"");
      if(S.answered){ if(i===q.answer) cls+=" right"; else if(S.sel[0]===i) cls+=" wrong"; else cls+=" dim"; }
      return `<button class="${cls}" data-i="${i}" ${S.answered?"disabled":""}><span class="k">${keys[i]}</span><span class="t"><span class="main${c.ja?" ja":""}">${esc(c.main)}</span>${c.sub?`<span class="sub">${esc(c.sub)}</span>`:""}</span></button>`; }).join("");
  }
  const showMap = q.map || (S.answered && q.mapAfter);
  const mapIds = (S.answered && q.mapAfter) ? q.mapAfter : (q.map || []);
  let fb="";
  if(S.answered){
    const ok=S.lastOk;
    fb = `<div class="fb ${ok?"ok":"ng"}"><span class="head">${ok?"정답!":"아쉬워요 — 뒤에서 다시 나와요"}</span><div>${q.explain}</div>${S.locked?`<span class="lock" id="lock">두 번 연속 틀렸어요. 해설을 읽고 <b id="lockn">5</b>초 뒤에 넘어갈 수 있어요.</span>`:""}</div>
      <button class="btn" id="next" ${S.locked?"disabled":""}>${ok?"다음":"확인했어요"}</button>`;
  }
  return `<div class="wrap">
    ${railHTML()}
    <section class="card q">
      <div class="qtag"><span class="chip" style="--c:${sc}">${esc(qs.group)}${S.set.composite&&qs.id.startsWith("w-")?" · "+esc(qs.name):""}</span><span>${esc(q.tag)}</span></div>
      <div class="prompt">${q.prompt}${q.subPrompt?`<span style="display:block;font-size:16px;margin-top:6px">${q.subPrompt}</span>`:""}</div>
      ${showMap?`<div class="mapbox">${mapSVG(mapIds,{ring:q.ring})}</div>`:""}
      ${q.svg?`<div class="mapbox">${q.svg}</div>`:""}${S.answered && q.svgAfter?`<div class="mapbox">${q.svgAfter}</div>`:""}
      <div class="choices${(showMap||q.svg) && !q.order && q.choices.every(c=>String(c.main).length<=8) ? " grid2":""}">${choices}</div>
      ${fb}
    </section>
  </div>`;
}
function bindQuiz(){
  document.querySelectorAll(".choice[data-i]").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  const nx=$("#next"); if(nx) nx.onclick=advance;
  if(S.locked){ let n=5; lockTimer=setInterval(()=>{ n--; const el=$("#lockn"); if(el) el.textContent=n; if(n<=0){ clearInterval(lockTimer); S.locked=false; const b=$("#next"); if(b) b.disabled=false; const l=$("#lock"); if(l) l.textContent="이제 넘어갈 수 있어요."; } },1000); }
}
function choose(i){
  if(S.answered) return;
  const q=S.q;
  if(q.order){ if(S.sel.includes(i)) return; S.sel.push(i); if(S.sel.length<q.choices.length){ render(); return; } }
  else S.sel=[i];
  const ok = q.order ? S.sel.every((v,k)=>v===q.correctOrder[k]) : i===q.answer;
  const idx=S.queue[S.pos];
  S.answered=true; S.lastOk=ok;
  if(ok){ S.cleared.add(idx); S.streak[idx]=0; if(S.round===1) S.firstOk.add(idx); S.locked=false; }
  else { S.streak[idx]=(S.streak[idx]||0)+1; S.next.push(idx); if(S.round===1) S.firstWrong.push(idx); S.locked = S.streak[idx]>=2; }
  render();
}
function advance(){
  clearTimeout(advTimer); clearInterval(lockTimer);
  if(!S.answered || S.locked) return;
  S.pos++;
  if(S.pos>=S.queue.length){
    if(S.next.length){ S.round++; S.queue=S.next; S.next=[]; S.pos=0; go("lap"); return; }
    finish(); return;
  }
  loadQ(); render(); window.scrollTo({top:0});
}

function finish(){

  const histKey=(S.practice?"phist.":"hist.")+S.name+"."+S.set.id;

  S.prev = hist.length? hist[hist.length-1] : null;
  hist.push({date, first, n:S.n}); store.set(histKey, hist.slice(-20));
  const rec = { ts:new Date().toISOString(), hm:fmtTime(new Date()).slice(0,5), date, cls:S.cls, name:S.name, set:S.set.id, setName:(S.practice?"연습 · ":"")+setLabel(S.set), n:S.n, first,

  if(!S.practice){ const log=store.get("log", []); log.push(rec); store.set("log", log.slice(-500)); }
  S.sent = submit(rec);
  go(S.practice? "result" : "ticket");
}
function submit(rec){
  const f=CONFIG.form;
  if(!f.url) return false;
  try{
    const fd=new FormData();
    fd.append(f.fields.name, rec.name); fd.append(f.fields.cls, rec.cls); fd.append(f.fields.set, rec.setName);
    fd.append(f.fields.first, rec.first+"/"+rec.n); fd.append(f.fields.time, Math.round(rec.elapsed/1000));
    fd.append(f.fields.wrong, rec.wrong.map(w=>w.id+" "+w.name).join(", "));
    if(f.fields.rounds) fd.append(f.fields.rounds, rec.rounds);
    fetch(f.url,{method:"POST",mode:"no-cors",body:fd}).catch(()=>{});
    return true;
  }catch(e){ return false; }
}

/* ───────── 강사 화면 · 학생 분석 (시트 기록 → Apps Script 웹 앱 → 여기) ───────── */
const AN_GROUPS = ["일본 지리","세계 지리","일본 연표","세계 연표","개념"].filter(g=>CONFIG.worldChrono || g!=="세계 연표");
const AN = { raw:null, recs:null, at:null, err:null, loading:false, cls:"전체", kind:"all", days:30, sort:"low", stu:null, setup:false };
function anConf(){ return { url: store.get("an.url", CONFIG.statsUrl||""), key: store.get("an.key", "") }; }
let AN_IDX = null;   // 문항 ID → {g: 영역, label}
function anIndex(){
  if(AN_IDX) return AN_IDX;
  AN_IDX = {};
  SETS.filter(s=>!s.composite && !s.soon).forEach(s=>s.pool().forEach(it=>{ const id=itemId(s.id,it); if(!AN_IDX[id]) AN_IDX[id]={g:s.group, label:itemLabel(it)}; }));
  return AN_IDX;
}
const AN_LABEL = (()=>{ const m={}; SETS.forEach(s=>{ m[setLabel(s)]=s; }); return m; })();
function anSet(label){
  let l=String(label||"").replace(/^연습 · /,"").trim().replace(/^개념\(기출\)/,"개념").replace("도도부현 위치","토도부현").replace("도도부현","토도부현").replace("자연지리(지형)","세계 지형").replace("기후 그래프(쾨펜)","기후 그래프");
  if(AN_LABEL[l]) return AN_LABEL[l];
  if(/일본 지리 · 지형/.test(l)) return setById("jp-land");
  return null;
}
const AN_ID = /, (?=(?:P\d{2}|L\d{3}|J\d{3}|G\d+|CL\d+|EV-\d+|WL\d{3}|WS\d{3}|K\d{4}-[\w-]+) )/;
function anParse(head, rows){
  const H=head.map(h=>String(h).trim());
  const col=(re,def)=>{ const i=H.findIndex((h,k)=>k>0 && re.test(h)); return i>=0? i : def; };
  const C={ name:col(/이름|name/i,1), cls:col(/^반|반$|class/i,2), set:col(/세트|범위|set/i,3), first:col(/첫|정답|점수|first|score/i,4),
            time:col(/시간|초\)|time/i,5), wrong:col(/틀린|오답|wrong/i,6), rounds:col(/바퀴|횟수|round/i,7) };
  const idx=anIndex();
  return rows.map(r=>{
    const ts=new Date(r[0]); if(isNaN(ts)) return null;
    const name=String(r[C.name]||"").trim(); if(!name) return null;
    const cls=String(r[C.cls]||"").trim(), setName=String(r[C.set]||"").trim();
    const m=String(r[C.first]||"").match(/(\d+)\s*\/\s*(\d+)/); if(!m) return null;
    const first=+m[1], n=+m[2]; if(!n) return null;
    const practice = cls==="연습" || /^연습 · /.test(setName);
    const set=anSet(setName);
    const wtxt=String(r[C.wrong]||"").trim();
    const wrong = wtxt? wtxt.split(AN_ID).map(s=>{ const k=s.indexOf(" "); const id=k>0? s.slice(0,k) : s; return {id, name:k>0? s.slice(k+1) : ""}; }) : [];
    // 영역별 출제 수·첫 시도 오답 수
    const asked={}, wg={};
    if(set && set.composite){
      const raw=set.composite.map(p=>p.share*n), q=raw.map(Math.floor); let left=n-q.reduce((a,b)=>a+b,0);
      raw.map((v,i)=>[v-Math.floor(v),i]).sort((a,b)=>b[0]-a[0]).forEach(([_,i])=>{ if(left>0){ q[i]++; left--; } });
      set.composite.forEach((p,i)=>asked[p.label]=(asked[p.label]||0)+q[i]);
      wrong.forEach(w=>{ const g=(idx[w.id]||{}).g; if(g) wg[g]=(wg[g]||0)+1; });
    } else {
      const g = set? set.group : (setName.replace(/^연습 · /,"").split(" · ")[0].replace(/^개념\(기출\)/,"개념"));
      if(AN_GROUPS.includes(g)){ asked[g]=n; wg[g]=n-first; }
    }
    const t=ts; const day=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
    return { ts, day, name, key:name.replace(/\s+/g,""), cls: practice? "연습" : cls, setName: setName.replace(/^연습 · /,""), set, practice, first, n,
             sec:+r[C.time]||0, rounds:+r[C.rounds]||1, wrong, asked, wg };
  }).filter(Boolean).sort((a,b)=>a.ts-b.ts);
}
function anLoad(force){
  const {url,key}=anConf();
  if(!url || !key){ AN.setup=true; render(); return; }
  if(!force && !AN.recs){ try{ const c=JSON.parse(sessionStorage.getItem("kitaku.an")||"null"); if(c){ AN.raw=c; AN.recs=anParse(c.head,c.rows); AN.at=new Date(c.at); render(); return; } }catch(e){} }
  AN.loading=true; AN.err=null; render();
  const cb="__kq"+Date.now(), sc=document.createElement("script");
  const end=()=>{ clearTimeout(tm); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } sc.remove(); AN.loading=false; };
  const tm=setTimeout(()=>{ end(); AN.err="net"; render(); }, 20000);
  window[cb]=d=>{ end();
    if(!d || !d.ok){ AN.err = d && d.error==="key" ? "key" : "net"; }
    else { AN.raw=d; AN.recs=anParse(d.head, d.rows); AN.at=new Date(d.at||Date.now()); AN.setup=false; try{ sessionStorage.setItem("kitaku.an", JSON.stringify(d)); }catch(e){} }
    render(); };
  sc.onerror=()=>{ end(); AN.err="net"; render(); };
  sc.src=url+(url.includes("?")?"&":"?")+"key="+encodeURIComponent(key)+"&callback="+cb;
  document.head.appendChild(sc);
}

/* 집계 */
function anClassesOf(recs){ const m={}; recs.forEach(r=>{ if(!r.practice && r.cls) (m[r.key]=m[r.key]||new Set()).add(r.cls); }); return m; }
function anFilter(){
  const all=AN.recs||[], since=AN.days? Date.now()-AN.days*864e5 : 0, cm=anClassesOf(all);
  return all.filter(r=> r.ts>=since && (AN.kind==="all" || (AN.kind==="class")===!r.practice)
    && (AN.cls==="전체" || (cm[r.key] && cm[r.key].has(AN.cls)) || (AN.cls==="연습만" && !cm[r.key])));
}
function anSum(recs){
  const s={n:recs.length, cls:0, prac:0, first:0, q:0, sec:0, g:{}};
  AN_GROUPS.forEach(g=>s.g[g]={a:0,w:0});
  recs.forEach(r=>{ r.practice? s.prac++ : s.cls++; s.first+=r.first; s.q+=r.n; s.sec+=r.sec;
    Object.entries(r.asked).forEach(([g,a])=>{ if(s.g[g]){ s.g[g].a+=a; s.g[g].w+=Math.min(a, r.wg[g]||0); } }); });
  s.acc = s.q? s.first/s.q : null;
  return s;
}
function anStudents(recs){
  const cm=anClassesOf(AN.recs||[]), by={};
  recs.forEach(r=>{ (by[r.key]=by[r.key]||[]).push(r); });
  return Object.entries(by).map(([k,rs])=>{
    const s=anSum(rs); const weak=AN_GROUPS.filter(g=>s.g[g].a>=5).map(g=>[g,1-s.g[g].w/s.g[g].a]).sort((a,b)=>a[1]-b[1])[0];
    return { key:k, name:rs[rs.length-1].name, cls: cm[k]? [...cm[k]].join("·") : "연습만", recs:rs, s, weak: weak && weak[1]<.8 ? weak : null, last:rs[rs.length-1].ts };
  });
}
function anWorst(recs, lim){
  const idx=anIndex(), t={};
  recs.forEach(r=>r.wrong.forEach(w=>{ const x=t[w.id]||(t[w.id]={id:w.id, c:0, who:new Set(), g:(idx[w.id]||{}).g||"", label:(idx[w.id]||{}).label||w.name}); x.c++; x.who.add(r.key); }));
  return Object.values(t).sort((a,b)=>b.c-a.c || b.who.size-a.who.size).slice(0, lim);
}

/* 표시 도우미 */
const pct = v => v==null? "–" : Math.round(v*100)+"%";
const mmdd = d => (d.getMonth()+1)+"/"+d.getDate();
function agoTxt(d){ const t0=new Date(); t0.setHours(0,0,0,0); const days=Math.round((t0-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5); return days<=0?"오늘":days===1?"어제":days+"일 전"; }
function sparkSVG(rs){
  const v=rs.slice(-10).map(r=>r.first/r.n); if(!v.length) return "";
  const W=72,H=22, x=i=> v.length<2? W/2 : 3+i*(W-6)/(v.length-1), y=a=>H-3-a*(H-6);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><polyline points="${v.map((a,i)=>x(i)+","+y(a)).join(" ")}" fill="none" stroke="var(--go)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(v.length-1)}" cy="${y(v[v.length-1])}" r="2.6" fill="var(--go)"/></svg>`;
}
function trendSVG(rs){
  const W=440,H=180,L=36,R=10,T=10,B=24, n=rs.length;
  const x=i=> n<2? (L+W-R)/2 : L+i*(W-L-R)/(n-1), y=a=>T+(1-a)*(H-T-B);
  const grid=[0,.5,1].map(a=>`<line x1="${L}" x2="${W-R}" y1="${y(a)}" y2="${y(a)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(a)+4}" text-anchor="end" class="ax">${a*100}%</text>`).join("");
  const line = n>1? `<polyline points="${rs.map((r,i)=>x(i)+","+y(r.first/r.n)).join(" ")}" fill="none" stroke="var(--go)" stroke-width="2" stroke-linejoin="round"/>` : "";
  const pts = rs.map((r,i)=>{ const a=r.first/r.n, tip=`${mmdd(r.ts)} ${r.practice?"연습":"수업"} · ${r.setName} · ${r.first}/${r.n}`;
    return `<g class="pt"><circle cx="${x(i)}" cy="${y(a)}" r="12" fill="transparent"/><circle cx="${x(i)}" cy="${y(a)}" r="4.5" fill="${r.practice?"var(--paper)":"var(--go)"}" stroke="var(--go)" stroke-width="2"/><title>${esc(tip)}</title></g>`; }).join("");
  const xl = n? `<text x="${x(0)}" y="${H-6}" class="ax" text-anchor="${n<2?"middle":"start"}">${mmdd(rs[0].ts)}</text>${n>1?`<text x="${x(n-1)}" y="${H-6}" class="ax" text-anchor="end">${mmdd(rs[n-1].ts)}</text>`:""}` : "";
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="첫 시도 정답률 추이">${grid}${line}${pts}${xl}</svg>`;
}
function barsHTML(s, base){
  return `<div class="abars">${AN_GROUPS.map(g=>{ const a=s.g[g].a, v=a? 1-s.g[g].w/a : null, b=base&&base.g[g].a? 1-base.g[g].w/base.g[g].a : null;
    return `<div class="abar${a?"":" none"}" title="${esc(g)} ${a? `${a-s.g[g].w}/${a} 정답` : "기록 없음"}${b!=null?` · 반 평균 ${pct(b)}`:""}"><span class="g">${esc(g)}</span>
      <span class="track">${v!=null?`<i style="width:${Math.max(v*100,1.5)}%"></i>`:""}${b!=null&&base!==s?`<b style="left:${b*100}%"></b>`:""}</span>
      <span class="v">${v!=null? pct(v) : "–"}<small>${a? ` ${a-s.g[g].w}/${a}` : ""}</small></span></div>`; }).join("")}</div>`;
}

function renderAnalysis(){
  const {url,key}=anConf();
  const head = `<div class="an-head"><div><span class="eyebrow">학생 분석${AN.at? ` · ${fmtTime(AN.at).slice(0,5)} 기준` : ""}</span><h1 style="font-size:24px">${AN.stu? "학생별 기록" : "반 전체 기록"}</h1></div>
    <div class="an-actions">${url&&key? `<button class="btn small ghost" id="an-reload" ${AN.loading?"disabled":""}>${AN.loading?"불러오는 중…":"새로고침"}</button>` : ""}<button class="btn small ghost" id="an-setup-btn">연결 설정</button></div></div>`;
  if(AN.setup || !url || !key) return head + anSetupHTML();
  if(AN.err) return head + `<section class="card an-msg">${AN.err==="key"? "비밀 키가 맞지 않아요. 「연결 설정」에서 Apps Script 코드의 KEY와 같은지 확인해 주세요." : "기록을 불러오지 못했어요. 인터넷 연결과 웹 앱 URL을 확인하고 새로고침해 주세요."}</section>`;
  if(!AN.recs) return head + `<section class="card an-msg">불러오는 중…</section>`;
  const recs=anFilter(), sum=anSum(recs);
  const cm=anClassesOf(AN.recs), clsOpts=["전체", ...Object.keys(CONFIG.classes), ...(AN.recs.some(r=>!cm[r.key])? ["연습만"] : [])];
  const filters = `<div class="an-filters">
    <div class="seg" role="group" aria-label="반">${clsOpts.map(c=>`<button data-acls="${esc(c)}" aria-pressed="${c===AN.cls}">${esc(c)}</button>`).join("")}</div>
    <div class="seg" role="group" aria-label="기록 종류">${[["all","전체"],["class","수업"],["prac","연습"]].map(([k,t])=>`<button data-akind="${k}" aria-pressed="${k===AN.kind}">${t}</button>`).join("")}</div>
    <div class="seg" role="group" aria-label="기간">${[[7,"7일"],[30,"30일"],[0,"전체"]].map(([d,t])=>`<button data-adays="${d}" aria-pressed="${d===AN.days}">${t}</button>`).join("")}</div></div>`;
  if(AN.stu) return head + filters + anStudentHTML(recs, sum);
  const studs=anStudents(recs);
  const sorters={ low:(a,b)=>(a.s.acc??2)-(b.s.acc??2), many:(a,b)=>b.s.n-a.s.n, recent:(a,b)=>b.last-a.last, name:(a,b)=>a.name.localeCompare(b.name,"ko") };
  studs.sort(sorters[AN.sort]||sorters.low);
  const since7=Date.now()-7*864e5, prac7=new Set(recs.filter(r=>r.practice && r.ts>=since7).map(r=>r.key)).size;
  const kpis = `<div class="kpis">
    <div class="kpi"><span>학생</span><b>${studs.length}<small>명</small></b></div>
    <div class="kpi"><span>응시</span><b>${sum.n}<small>회</small></b><em>수업 ${sum.cls} · 연습 ${sum.prac}</em></div>
    <div class="kpi"><span>첫 시도 정답률</span><b>${pct(sum.acc)}</b></div>
    <div class="kpi"><span>최근 7일 혼자 연습</span><b>${prac7}<small>명</small></b></div></div>`;
  const rows = studs.map(st=>`<tr data-stu="${esc(st.key)}" tabindex="0"><td><b>${esc(st.name)}</b></td><td>${esc(st.cls)}</td><td class="num">${st.s.cls}</td><td class="num">${st.s.prac}</td>
      <td><span class="accb"><i style="width:${(st.s.acc||0)*100}%"></i></span><span class="num">${pct(st.s.acc)}</span></td><td>${sparkSVG(st.recs)}</td>
      <td>${st.weak? `<span class="weak">${esc(st.weak[0])} ${pct(st.weak[1])}</span>` : `<span class="muted">–</span>`}</td><td class="muted">${agoTxt(st.last)}</td></tr>`).join("");
  const worst=anWorst(recs, 10);
  return head + filters + kpis + `<div class="tgrid an-grid">
    <section class="card an-card"><div class="an-ttl"><h2>학생별</h2><label class="sortsel">정렬 <select id="an-sort">${[["low","정답률 낮은 순"],["many","응시 많은 순"],["recent","최근 순"],["name","이름순"]].map(([k,t])=>`<option value="${k}" ${k===AN.sort?"selected":""}>${t}</option>`).join("")}</select></label></div>
      ${studs.length? `<div class="tbl"><table class="stbl"><thead><tr><th>이름</th><th>반</th><th>수업</th><th>연습</th><th>정답률</th><th>최근 10회</th><th>약한 영역</th><th>마지막</th></tr></thead><tbody>${rows}</tbody></table></div><p class="hint">이름을 누르면 그 학생의 자세한 기록이 나와요.</p>` : `<div class="empty">이 조건에 맞는 기록이 없어요.</div>`}</section>
    <div style="display:flex;flex-direction:column;gap:14px">
      <section class="card an-card"><div class="an-ttl"><h2>영역별 첫 시도 정답률</h2></div>${barsHTML(sum, null)}</section>
      <section class="card an-card"><div class="an-ttl"><h2>많이 틀린 문항</h2><span class="muted" style="font-size:12px">틀린 횟수 · 학생 수</span></div>
        ${worst.length? `<ol class="wlist">${worst.map(w=>`<li><span class="gchip">${esc(w.g||"기타")}</span><span class="lb">${esc(w.label)}</span><span class="c">${w.c}회 · ${w.who.size}명</span></li>`).join("")}</ol>` : `<div class="empty">틀린 문항이 없어요.</div>`}</section>
    </div></div>`;
}
function anStudentHTML(recs, classSum){
  const rs=recs.filter(r=>r.key===AN.stu), all=(AN.recs||[]).filter(r=>r.key===AN.stu);
  const name = all.length? all[all.length-1].name : AN.stu;
  const back = `<button class="btn small ghost" id="an-back">← 반 전체</button>`;
  if(!rs.length) return `<section class="card an-card">${back}<div class="empty">${esc(name)} 학생은 이 기간·조건에 기록이 없어요.${all.length? ` (전체 기간 ${all.length}회)` : ""}</div></section>`;
  const s=anSum(rs), since7=Date.now()-7*864e5, p7=rs.filter(r=>r.practice && r.ts>=since7).length;
  const cm=anClassesOf(AN.recs); const cls=cm[AN.stu]? [...cm[AN.stu]].join("·") : "연습만";
  // 범위별
  const bySet={}; rs.forEach(r=>{ const k=r.set? setLabel(r.set) : r.setName; const x=bySet[k]||(bySet[k]={k,c:0,f:0,q:0,last:r.ts}); x.c++; x.f+=r.first; x.q+=r.n; x.last=r.ts; });
  const sets=Object.values(bySet).sort((a,b)=>b.last-a.last);
  const worst=anWorst(rs, 12);
  const recent=rs.slice(-15).reverse();
  return `<section class="card an-card stu-head">${back}
      <div class="stu-id"><h2>${esc(name)}</h2><span class="muted">${esc(cls)} · 마지막 ${agoTxt(rs[rs.length-1].ts)}</span></div>
      <div class="kpis in">
        <div class="kpi"><span>수업 응시</span><b>${s.cls}<small>회</small></b></div>
        <div class="kpi"><span>혼자 연습</span><b>${s.prac}<small>회</small></b><em>최근 7일 ${p7}회</em></div>
        <div class="kpi"><span>첫 시도 정답률</span><b>${pct(s.acc)}</b><em>반 전체 ${pct(classSum.acc)}</em></div>
        <div class="kpi"><span>문항당 시간</span><b>${s.q? Math.round(s.sec/s.q) : "–"}<small>초</small></b></div></div></section>
    <div class="tgrid an-grid">
      <section class="card an-card"><div class="an-ttl"><h2>첫 시도 정답률 추이</h2><span class="legend"><i class="dot on"></i>수업 <i class="dot"></i>연습</span></div>${trendSVG(rs)}<p class="hint">점에 마우스를 올리면 날짜·범위·점수가 보여요.</p></section>
      <section class="card an-card"><div class="an-ttl"><h2>영역별 첫 시도 정답률</h2><span class="legend"><i class="barkey"></i>${esc(name)} <i class="tick"></i>반 평균</span></div>${barsHTML(s, classSum)}</section>
      <section class="card an-card"><div class="an-ttl"><h2>자주 틀린 문항</h2><span class="muted" style="font-size:12px">첫 시도 기준</span></div>
        ${worst.length? `<ol class="wlist">${worst.map(w=>`<li><span class="gchip">${esc(w.g||"기타")}</span><span class="lb">${esc(w.label)}</span><span class="c">${w.c}회</span></li>`).join("")}</ol>` : `<div class="empty">첫 시도에 틀린 문항이 없어요.</div>`}</section>
      <section class="card an-card"><div class="an-ttl"><h2>범위별</h2></div><div class="tbl"><table><thead><tr><th>범위</th><th>응시</th><th>정답률</th><th>마지막</th></tr></thead><tbody>
        ${sets.map(x=>`<tr><td>${esc(x.k)}</td><td class="num">${x.c}</td><td class="num">${pct(x.f/x.q)}</td><td class="muted">${agoTxt(x.last)}</td></tr>`).join("")}</tbody></table></div></section>
    </div>
    <section class="card an-card"><div class="an-ttl"><h2>최근 기록</h2><span class="muted" style="font-size:12px">최근 ${recent.length}회</span></div><div class="tbl"><table><thead><tr><th>날짜</th><th>구분</th><th>범위</th><th>첫 시도</th><th>바퀴</th><th>시간</th></tr></thead><tbody>
      ${recent.map(r=>`<tr><td class="num">${mmdd(r.ts)} ${fmtTime(r.ts).slice(0,5)}</td><td>${r.practice?"연습":esc(r.cls)}</td><td>${esc(r.set? setLabel(r.set) : r.setName)}</td><td class="num">${r.first}/${r.n}</td><td class="num">${r.rounds}</td><td class="num">${fmtDur(r.sec*1000)}</td></tr>`).join("")}</tbody></table></div></section>`;
}
function anSetupHTML(){
  const {url,key}=anConf();
  return `<section class="card an-card setup">
    <h2>시트 기록 연결</h2>
    <p class="muted" style="margin:0">학생 기록은 구글 시트에 있어요. 시트에 작은 읽기 코드(Apps Script)를 한 번 붙여 두면 여기서 학생별로 분석해 볼 수 있어요. 비밀 키를 아는 사람만 기록을 볼 수 있어요.</p>
    <ol class="steps">
      <li>기록 시트 → <b>확장 프로그램 → Apps Script</b></li>
      <li>받은 <b>kitaku_apps_script.gs</b> 내용을 통째로 붙여넣고 저장</li>
      <li><b>배포 → 새 배포</b> → 유형 「웹 앱」, 실행: 나, 액세스: <b>모든 사용자</b> → 배포 (처음엔 권한 허용 창이 떠요)</li>
      <li>나온 <b>웹 앱 URL</b>과 코드 맨 위 <b>KEY</b>를 아래에 붙여넣기</li>
    </ol>
    <div class="field"><label for="an-url">웹 앱 URL</label><input class="pick mono" id="an-url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(url)}" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label for="an-key">비밀 키</label><input class="pick mono" id="an-key" placeholder="xxxx-xxxx-xxxx" value="${esc(key)}" autocomplete="off" spellcheck="false"></div>
    <button class="btn" id="an-save">저장하고 불러오기</button>
    <p class="hint">URL과 키는 이 기기(브라우저)에만 저장돼요. 다른 기기에서 볼 때는 한 번 더 넣어 주세요.</p>
  </section>`;
}
function bindAnalysis(){
  const on=(sel,f)=>{ const e=$(sel); if(e) e.onclick=f; };
  on("#an-reload", ()=>anLoad(true));
  on("#an-setup-btn", ()=>{ AN.setup=!AN.setup; render(); });
  on("#an-back", ()=>{ AN.stu=null; render(); window.scrollTo(0,0); });
  on("#an-save", ()=>{ const u=$("#an-url").value.trim(), k=$("#an-key").value.trim(); if(!u||!k) return; store.set("an.url", u); store.set("an.key", k); AN.setup=false; AN.recs=null; try{ sessionStorage.removeItem("kitaku.an"); }catch(e){} anLoad(true); });
  document.querySelectorAll("[data-acls]").forEach(b=>b.onclick=()=>{ AN.cls=b.dataset.acls; render(); });
  document.querySelectorAll("[data-akind]").forEach(b=>b.onclick=()=>{ AN.kind=b.dataset.akind; render(); });
  document.querySelectorAll("[data-adays]").forEach(b=>b.onclick=()=>{ AN.days=+b.dataset.adays; render(); });
  const so=$("#an-sort"); if(so) so.onchange=()=>{ AN.sort=so.value; render(); };
  document.querySelectorAll("tr[data-stu]").forEach(tr=>{ const go_=()=>{ AN.stu=tr.dataset.stu; render(); window.scrollTo(0,0); }; tr.onclick=go_; tr.onkeydown=e=>{ if(e.key==="Enter") go_(); }; });
  if(!AN.recs && !AN.loading && !AN.err && !AN.setup && anConf().url && anConf().key) anLoad(false);
}

/* ───────── 렌더 ───────── */
function render(){
  $("#nav-student").setAttribute("aria-pressed", view!=="teacher");
  $("#nav-teacher").setAttribute("aria-pressed", view==="teacher");
  const app=$("#app");
  $("#nav-teacher").hidden = !(tUnlocked() || view==="teacher");
  $(".nav").hidden = $("#nav-teacher").hidden;
  if(view==="pin"){ app.innerHTML=renderPin(); bindPin(); }
  else if(view==="teacher"){ app.innerHTML=renderTeacher(); bindTeacher(); }
  else if(view==="quiz" && S){ app.innerHTML=renderQuiz(); bindQuiz(); }
  else if(view==="lap" && S){ app.innerHTML=renderLap(); bindLap(); }
  else if(view==="ticket" && S){ app.innerHTML=renderTicket(); bindTicket(); }
  else if(view==="result" && S){ app.innerHTML=renderResult(); bindResult(); }
  else if(view==="practice" || (view!=="entry" && mode==="practice")){ view="practice"; app.innerHTML=renderPractice(); bindPractice(); }
  else { view="entry"; app.innerHTML=renderEntry(); bindEntry(); }
}
document.addEventListener("keydown",e=>{
  if(view!=="quiz"||!S) return;
  if(!S.answered && /^[1-4]$/.test(e.key)){ const i=+e.key-1; if(i<S.q.choices.length) choose(i); }
  else if(S.answered && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); advance(); }
});
render();
})();
</script>
</body>
